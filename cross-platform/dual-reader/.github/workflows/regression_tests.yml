name: Regression Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-android:
    name: Regression Tests (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: dual_reader
        run: flutter pub get

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run regression tests (Android) - Shard ${{ matrix.shard }}
        working-directory: dual_reader
        run: |
          bash ../scripts/run_regression_tests.sh \
            --platform android \
            --shard ${{ matrix.shard }} \
            --total-shards 4

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-android-shard-${{ matrix.shard }}
          path: |
            dual_reader/test_results/
            dual_reader/test_screenshots/
          retention-days: 7

      - name: Upload coverage
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: coverage-android
          path: dual_reader/coverage/
          retention-days: 7

  regression-ios:
    name: Regression Tests (iOS)
    runs-on: macos-latest
    timeout-minutes: 45

    strategy:
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: dual_reader
        run: flutter pub get

      - name: Run regression tests (iOS) - Shard ${{ matrix.shard }}
        working-directory: dual_reader
        run: |
          bash ../scripts/run_regression_tests.sh \
            --platform ios \
            --shard ${{ matrix.shard }} \
            --total-shards 4

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-ios-shard-${{ matrix.shard }}
          path: |
            dual_reader/test_results/
            dual_reader/test_screenshots/
          retention-days: 7

      - name: Upload coverage
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ios
          path: dual_reader/coverage/
          retention-days: 7

  regression-web:
    name: Regression Tests (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        shard: [1, 2, 3, 4]
        browser: [chrome]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: dual_reader
        run: flutter pub get

      - name: Run regression tests (Web) - Shard ${{ matrix.shard }}
        working-directory: dual_reader
        run: |
          bash ../scripts/run_regression_tests.sh \
            --platform web \
            --browser ${{ matrix.browser }} \
            --shard ${{ matrix.shard }} \
            --total-shards 4

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-web-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            dual_reader/test_results/
            dual_reader/test_screenshots/
          retention-days: 7

      - name: Upload coverage
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: dual_reader/coverage/
          retention-days: 7

  regression-report:
    name: Generate Regression Test Report
    runs-on: ubuntu-latest
    needs: [regression-android, regression-ios, regression-web]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Android results
        uses: actions/download-artifact@v4
        with:
          pattern: regression-results-android-shard-*
          path: results/android/
          merge-multiple: true

      - name: Download all iOS results
        uses: actions/download-artifact@v4
        with:
          pattern: regression-results-ios-shard-*
          path: results/ios/
          merge-multiple: true

      - name: Download all Web results
        uses: actions/download-artifact@v4
        with:
          pattern: regression-results-web-*-shard-*
          path: results/web/
          merge-multiple: true

      - name: Merge coverage reports
        run: |
          # Combine coverage from all platforms
          bash scripts/merge_coverage.sh results/

      - name: Generate test report
        run: |
          bash scripts/generate_test_report.sh \
            --name "Regression Tests" \
            --results-dir results \
            --coverage-dir results/coverage \
            --output regression-report.html

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-report
          path: |
            regression-report.html
            results/coverage/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./results/coverage/lcov.info
          flags: regression-tests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## Regression Tests Results\n\n';

            // Parse test results
            const platforms = ['android', 'ios', 'web'];
            for (const platform of platforms) {
              try {
                const data = fs.readFileSync(`results/${platform}/summary.json`, 'utf8');
                const results = JSON.parse(data);
                summary += `### ${platform.charAt(0).toUpperCase() + platform.slice(1)}\n`;
                summary += `- ✅ Passed: ${results.passed}\n`;
                summary += `- ❌ Failed: ${results.failed}\n`;
                summary += `- ⏭️ Skipped: ${results.skipped}\n`;
                summary += `- ⏱️ Duration: ${results.duration}\n\n`;
              } catch (e) {
                summary += `### ${platform.charAt(0).toUpperCase() + platform.slice(1)}\n`;
                summary += `❌ No results available\n\n`;
              }
            }

            summary += `\n[View Full Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Check for flaky tests
        run: |
          bash scripts/detect_flaky_tests.sh results/ flaky-tests.json

      - name: Upload flaky tests report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-report
          path: flaky-tests.json
          retention-days: 90

  gatekeeper:
    name: Gatekeeper Check
    runs-on: ubuntu-latest
    needs: [regression-android, regression-ios, regression-web]
    if: always()

    steps:
      - name: Check for bypass label
        id: bypass
        uses: actions/github-script@v7
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const hasBypass = labels.some(l => l.name === 'tests-bypass');
            return hasBypass ? 'true' : 'false';

      - name: Check all jobs passed
        if: steps.bypass.outputs.result != 'true'
        run: |
          if [[ "${{ needs.regression-android.result }}" != "success" ]] || \
             [[ "${{ needs.regression-ios.result }}" != "success" ]] || \
             [[ "${{ needs.regression-web.result }}" != "success" ]]; then
            echo "::error::One or more regression test jobs failed"
            echo "::error::To bypass, add the 'tests-bypass' label"
            exit 1
          fi
          echo "All regression tests passed successfully"

      - name: Warn on bypass
        if: steps.bypass.outputs.result == 'true'
        run: |
          echo "::warning::Tests bypassed with 'tests-bypass' label"
          echo "::warning::This should only be used in emergencies"
