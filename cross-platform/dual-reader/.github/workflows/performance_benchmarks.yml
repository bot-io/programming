name: Performance Benchmarks

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'dual_reader/lib/**/*.dart'
      - 'dual_reader/test/**'
      - 'dual_reader/integration_test/**'
  push:
    branches: [main, develop]
    paths:
      - 'dual_reader/lib/**/*.dart'
      - 'dual_reader/test/**'
      - 'dual_reader/integration_test/**'
  workflow_dispatch:

concurrency:
  group: performance-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark-android:
    name: Performance Benchmarks (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for comparison

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: dual_reader
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run performance benchmarks
        working-directory: dual_reader
        run: |
          bash ../scripts/run_performance_benchmarks.sh --platform android

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-android
          path: dual_reader/performance_results/android/
          retention-days: 30

      - name: Compare with baseline
        run: |
          bash scripts/compare_performance.sh \
            --current dual_reader/performance_results/android/ \
            --baseline .github/baselines/android-performance.json \
            --threshold 10 \
            --output comparison-android.json

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## Performance Benchmark Results (Android)\n\n';

            try {
              const comparison = JSON.parse(fs.readFileSync('comparison-android.json', 'utf8'));

              const metrics = [
                { name: 'App Startup Time', key: 'app_startup', unit: 'ms' },
                { name: 'Page Load Time', key: 'page_load', unit: 'ms' },
                { name: 'Translation Time', key: 'translation', unit: 'ms' },
                { name: 'Pagination Time', key: 'pagination', unit: 'ms' },
                { name: 'Memory Usage', key: 'memory', unit: 'MB' },
              ];

              for (const metric of metrics) {
                const value = comparison.current[metric.key];
                const baseline = comparison.baseline[metric.key];
                const diff = comparison.diffs[metric.key];

                const emoji = diff > 10 ? '🔴' : diff < -10 ? '🟢' : '🟡';
                const diffStr = diff > 0 ? `+${diff.toFixed(1)}%` : `${diff.toFixed(1)}%`;

                comment += `### ${emoji} ${metric.name}\n`;
                comment += `- Current: **${value.toFixed(1)} ${metric.unit}**\n`;
                comment += `- Baseline: ${baseline.toFixed(1)} ${metric.unit}\n`;
                comment += `- Difference: ${diffStr}\n\n`;
              }

              if (comparison.regressions && comparison.regressions.length > 0) {
                comment += '⚠️ **Performance Regressions Detected:**\n';
                for (const reg of comparison.regressions) {
                  comment += `- ${reg.metric}: ${reg.diff.toFixed(1)}% slower\n`;
                }
              } else if (comparison.improvements && comparison.improvements.length > 0) {
                comment += '✅ **Performance Improvements:**\n';
                for (const imp of comparison.improvements) {
                  comment += `- ${imp.metric}: ${Math.abs(imp.diff).toFixed(1)}% faster\n`;
                }
              }
            } catch (e) {
              comment += 'Unable to generate performance comparison.\n';
              comment += '```\n' + e.message + '\n```\n';
            }

            comment += `\n[View Details](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  benchmark-ios:
    name: Performance Benchmarks (iOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: dual_reader
        run: flutter pub get

      - name: Run performance benchmarks
        working-directory: dual_reader
        run: |
          bash ../scripts/run_performance_benchmarks.sh --platform ios

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-ios
          path: dual_reader/performance_results/ios/
          retention-days: 30

      - name: Compare with baseline
        run: |
          bash scripts/compare_performance.sh \
            --current dual_reader/performance_results/ios/ \
            --baseline .github/baselines/ios-performance.json \
            --threshold 10 \
            --output comparison-ios.json

      - name: Update baseline if approved
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bash scripts/update_baseline.sh \
            --current dual_reader/performance_results/ios/ \
            --baseline .github/baselines/ios-performance.json

      - name: Commit updated baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/baselines/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update performance baselines [skip ci]"
          git push

  benchmark-web:
    name: Performance Benchmarks (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: dual_reader
        run: flutter pub get

      - name: Run performance benchmarks
        working-directory: dual_reader
        run: |
          bash ../scripts/run_performance_benchmarks.sh --platform web

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-web
          path: dual_reader/performance_results/web/
          retention-days: 30

      - name: Compare with baseline
        run: |
          bash scripts/compare_performance.sh \
            --current dual_reader/performance_results/web/ \
            --baseline .github/baselines/web-performance.json \
            --threshold 10 \
            --output comparison-web.json

      - name: Update trending data
        run: |
          bash scripts/update_performance_trends.sh \
            --results dual_reader/performance_results/web/ \
            --trending-file .github/trends/web-performance.json

      - name: Commit trending data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/trends/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update performance trends [skip ci]"
          git push

  performance-report:
    name: Generate Performance Report
    runs-on: ubuntu-latest
    needs: [benchmark-android, benchmark-ios, benchmark-web]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: performance_results/
          merge-multiple: true

      - name: Generate performance report
        run: |
          bash scripts/generate_performance_report.sh \
            --results-dir performance_results/ \
            --output performance-report.html

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.html
          retention-days: 90

  perf-regression-check:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: [benchmark-android, benchmark-ios, benchmark-web]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download comparison results
        uses: actions/download-artifact@v4
        with:
          pattern: comparison-*.json
          path: comparisons/
          merge-multiple: false

      - name: Check for regressions
        run: |
          bash scripts/check_performance_regressions.sh \
            --comparisons-dir comparisons/ \
            --threshold 15 \
            --output regressions.json

      - name: Fail on significant regressions
        run: |
          if [ -f regressions.json ]; then
            echo "::error::Performance regressions detected"
            cat regressions.json
            exit 1
          fi
          echo "No significant performance regressions"

      - name: Add label for regressions
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['performance-regression']
            });

      - name: Remove label if no regressions
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'performance-regression'
              });
            } catch (e) {
              // Label doesn't exist, ignore
            }
