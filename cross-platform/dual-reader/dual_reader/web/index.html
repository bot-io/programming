<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dual Reader - Bilingual ebook reader. Read original and translated text side-by-side.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dual Reader">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dual Reader</title>
  <link rel="manifest" href="manifest.json">

  <!-- Transformers.js v3 for client-side translation -->
  <!-- Using NLLB-200 distilled model (600M parameters) for 200+ languages -->
  <!-- FLORES-200 language codes: https://github.com/facebookresearch/flores/blob/main/flores200/README.md -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

    // Configure Transformers.js
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    // Global pipeline references - one per language pair for efficiency
    const translators = new Map(); // key: "sourceLang-targetLang", value: pipeline
    const loadingModels = new Map(); // Track models currently being loaded

    // NLLB-200 distilled model (600M) - supports 200+ languages
    const MODEL_NAME = 'facebook/nllb-200-distilled-600M';

    // FLORES-200 language code mapping (BCP 47 -> FLORES-200)
    const FLORES_CODES = {
      'en': 'eng_Latn',
      'es': 'spa_Latn',
      'fr': 'fra_Latn',
      'de': 'deu_Latn',
      'it': 'ita_Latn',
      'pt': 'por_Latn',
      'zh': 'zho_Hans',
      'ja': 'jpn_Jpan',
      'ko': 'kor_Hang',
      'ru': 'rus_Cyrl',
      'bg': 'bul_Cyrl',
      'ar': 'arb_Arab',
      'hi': 'hin_Deva',
      'th': 'tha_Thai',
      'vi': 'vie_Latn',
      'tr': 'tur_Latn',
      'nl': 'nld_Latn',
      'pl': 'pol_Latn',
      'sv': 'swe_Latn',
      'da': 'dan_Latn',
      'fi': 'fin_Latn',
      'no': 'nob_Latn',
      'uk': 'ukr_Cyrl',
      'cs': 'ces_Latn',
      'el': 'ell_Grek',
      'he': 'heb_Hebr',
      'id': 'ind_Latn',
      'ms': 'zsm_Latn',
      'ro': 'ron_Latn',
      'hu': 'hun_Latn',
      'bn': 'ben_Beng',
      'ca': 'cat_Latn',
      'fa': 'pes_Arab',
      'fil': 'tgl_Latn',
      'tl': 'tgl_Latn',
      'hr': 'hrv_Latn',
      'mt': 'mlt_Latn',
      'sl': 'slv_Latn',
      'af': 'afr_Latn',
      'sq': 'sqi_Latn',
      'be': 'bel_Cyrl',
      'et': 'est_Latn',
      'ga': 'gle_Latn',
      'gl': 'glg_Latn',
      'ka': 'kat_Geor',
      'gu': 'guj_Gujr',
      'ht': 'hat_Latn',
      'is': 'isl_Latn',
      'kn': 'kan_Knda',
      'lv': 'lav_Latn',
      'lt': 'lit_Latn',
      'mk': 'mkd_Cyrl',
      'mr': 'mar_Deva',
      'sw': 'swh_Latn',
      'ta': 'tam_Taml',
      'te': 'tel_Telu',
      'ur': 'urd_Arab',
      'cy': 'cym_Latn',
    };

    /**
     * Convert BCP 47 language code to FLORES-200 code
     */
    function toFloresCode(langCode) {
      return FLORES_CODES[langCode.toLowerCase()] || 'eng_Latn';
    }

    /**
     * Load the NLLB-200 translation model for a specific language pair
     */
    async function loadModel(sourceLang, targetLang) {
      const key = `${sourceLang}-${targetLang}`;

      // Return cached translator if available
      if (translators.has(key)) {
        console.log(`[Transformers.js] Using cached translator for ${key}`);
        return translators.get(key);
      }

      // Check if already loading
      if (loadingModels.has(key)) {
        console.log(`[Transformers.js] Model for ${key} is already loading, waiting...`);
        return loadingModels.get(key);
      }

      console.log(`[Transformers.js] Loading NLLB-200 model for ${sourceLang} -> ${targetLang}`);

      const loadingPromise = (async () => {
        try {
          const floresSource = toFloresCode(sourceLang);
          const floresTarget = toFloresCode(targetLang);

          console.log(`[Transformers.js] FLORES codes: ${floresSource} -> ${floresTarget}`);

          const translator = await pipeline('translation', MODEL_NAME, {
            progress_callback: (progress) => {
              if (progress.status === 'downloading') {
                const percent = progress.progress ? Math.round(progress.progress) : 0;
                console.log(`[Transformers.js] Downloading model: ${percent}%`);
              } else if (progress.status === 'loading-model') {
                console.log('[Transformers.js] Loading model into memory...');
              }
            }
          });

          console.log(`[Transformers.js] Model loaded successfully for ${key}`);
          translators.set(key, translator);
          loadingModels.delete(key);

          return translator;
        } catch (error) {
          console.error(`[Transformers.js] Failed to load model for ${key}:`, error);
          loadingModels.delete(key);
          throw error;
        }
      })();

      loadingModels.set(key, loadingPromise);
      return loadingPromise;
    }

    /**
     * Translate text using NLLB-200
     */
    async function translate(text, sourceLang, targetLang) {
      const key = `${sourceLang}-${targetLang}`;
      console.log(`[Transformers.js] Translating (${key}): ${text.length} characters`);

      const translator = await loadModel(sourceLang, targetLang);

      const floresSource = toFloresCode(sourceLang);
      const floresTarget = toFloresCode(targetLang);

      const result = await translator(text, {
        src_lang: floresSource,
        tgt_lang: floresTarget,
      });

      console.log(`[Transformers.js] Translation complete: ${result.length} characters`);
      return result;
    }

    // Global variable for text input
    (function() {
      let _savedText = null;
      window.transformersText = null;

      window.setText = function(text) {
        if (window.transformersText && window.transformersText.length > 0) {
          _savedText = window.transformersText;
        } else {
          _savedText = text;
        }
      };

      window.getText = function() {
        return _savedText;
      };

      /**
       * Main translation function called from Dart
       * @param {string} textParam - Text to translate
       * @param {string} targetLang - Target language code (BCP 47)
       * @param {string} sourceLang - Source language code (BCP 47), defaults to 'en'
       */
      window.transformersTranslate = async function(textParam, targetLang, sourceLang) {
        const text = textParam || _savedText;
        const source = sourceLang || 'en';
        const target = targetLang || 'es';

        console.log(`[Transformers.js] Translation request: ${source} -> ${target}`);
        console.log(`[Transformers.js] Text length: ${text?.length || 0} characters`);

        if (!text) {
          console.error('[Transformers.js] No text provided for translation');
          return null;
        }

        try {
          const result = await translate(text, source, target);
          return result;
        } catch (error) {
          console.error('[Transformers.js] Translation error:', error);
          return null;
        }
      };

      /**
       * Check if a model is loaded for a language pair
       */
      window.transformersIsModelReady = function(sourceLang, targetLang) {
        const key = `${sourceLang || 'en'}-${targetLang || 'es'}`;
        return translators.has(key);
      };

      /**
       * Pre-load a model for a language pair
       */
      window.transformersLoadModel = async function(sourceLang, targetLang) {
        const source = sourceLang || 'en';
        const target = targetLang || 'es';
        await loadModel(source, target);
        return true;
      };
    })();

    // Set ready flag
    window.transformersReady = true;
    window.transformersAPI = 'nllb-200';

    console.log('[Transformers.js] Initialized - NLLB-200 client-side translation ready');
    console.log('[Transformers.js] Supports 200+ languages via FLORES-200 codes');

    // Pre-load English -> Spanish model on startup for better UX
    console.log('[Transformers.js] Pre-loading English -> Spanish model...');
    loadModel('en', 'es').catch(err => {
      console.error('[Transformers.js] Pre-load failed:', err);
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!-- File drag-and-drop handler for web -->
  <script>
    // Prevent default browser behavior for drag events on the whole page
    document.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.stopPropagation();
    });
    document.addEventListener('dragenter', function(e) {
      e.preventDefault();
      e.stopPropagation();
    });

    // Handle file drops - forward to Flutter via dart:js_interop
    document.addEventListener('drop', function(e) {
      e.preventDefault();
      e.stopPropagation();

      const files = e.dataTransfer.files;
      if (files.length === 0) return;

      // Read each dropped file and forward to Flutter
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const reader = new FileReader();

        reader.onload = function(event) {
          // Send file data to Flutter via a custom event
          if (window._flutterBuilder && window._flutterBuilder.onDroppedFile) {
            window._flutterBuilder.onDroppedFile(file.name, event.target.result);
          }
        };

        // Read as ArrayBuffer for binary files (epub, mobi)
        reader.readAsArrayBuffer(file);
      }
    });
  </script>
</body>
</html>
